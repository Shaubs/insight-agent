[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insight-agent"
version = "0.1.0"
description = "Dump your data, ask questions, get insights."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Runtime dependencies are added with the slice that first needs them.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
